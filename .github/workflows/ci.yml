name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: |
          python - <<'PY'
          import json, os
          baseline = json.load(open('compatibility.json'))
          pinned = json.load(open('tests/pi/package.json'))['devDependencies']['@earendil-works/pi-coding-agent']
          rows = [{'os': 'ubuntu-latest', 'python': v, 'pi': pinned} for v in ['3.11', '3.12', '3.13', '3.14']]
          rows += [{'os': os_name, 'python': '3.14', 'pi': pinned} for os_name in ['macos-latest', 'windows-latest']]
          if baseline['minimumVersion'] != pinned:
              rows += [{'os': 'ubuntu-latest', 'python': '3.14', 'pi': baseline['minimumVersion']}]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('include=' + json.dumps(rows) + '\n')
          PY
  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: Test ${{ matrix.os }} Python ${{ matrix.python }} Pi ${{ matrix.pi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/pi/package-lock.json
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: npm ci --prefix tests/pi --ignore-scripts --no-audit --no-fund
      - name: Select runtime under test
        env:
          PI_VERSION: ${{ matrix.pi }}
        shell: bash
        run: npm install --prefix tests/pi --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION"
      - run: uv run --no-sync pytest -m "not live"
        env:
          PI_CLIENT_REQUIRE_INTEGRATION: '1'
          PI_CLIENT_EXPECTED_PI_VERSION: ${{ matrix.pi }}
      - name: Smoke runnable examples
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --no-sync python scripts/check_examples.py
        env:
          PI_CLIENT_REQUIRE_INTEGRATION: '1'
          PI_CLIENT_EXPECTED_PI_VERSION: ${{ matrix.pi }}
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked --group dev --python 3.11
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync mypy --strict examples scripts/check_examples.py
      - run: uv run --no-sync python -m build
      - run: uv run --no-sync twine check dist/*
      - run: uv run --no-sync python scripts/check_distribution.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/check_upstream.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-review
          path: upstream-report.md
  required:
    if: always()
    needs: [matrix, test, quality, protocol]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
