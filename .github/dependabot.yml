version: 2
updates:
  - package-ecosystem: npm
    directory: /tests/pi
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    allow:
      - dependency-name: "@earendil-works/pi-coding-agent"
    open-pull-requests-limit: 2
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
